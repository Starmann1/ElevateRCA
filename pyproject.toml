[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elevaterca"
version = "1.0.0"
description = "Autonomous Fault Isolation & Evidence-Driven Root Cause Analysis Assistant for Modern Elevators"
authors = [{ name = "Arul Amudhan G" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "chromadb>=0.4.24",
    "pymupdf>=1.24.0",
    "pypdf>=4.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "pytest>=8.1.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
